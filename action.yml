name: aas-sign
description: Sign PE images, MSI installers, and MSIX packages and bundles with Azure Artifact Signing

inputs:
  endpoint:
    description: Azure Trusted Signing endpoint host (e.g. eus.codesigning.azure.net)
    required: true
  account:
    description: Trusted Signing account name
    required: true
  profile:
    description: Certificate profile name
    required: true
  files:
    description: Files to sign, one path per line
    required: true
  client-id:
    description: Azure app registration client ID (for GitHub OIDC federation).
    required: false
    default: ""
  tenant-id:
    description: Azure tenant ID (used with client-id for OIDC).
    required: false
    default: ""
  token:
    description: |
      Pre-minted Azure bearer token.  Usually omitted -- set client-id and
      tenant-id instead and let aas-sign perform the OIDC exchange.
    required: false
    default: ""
  version:
    description: aas-sign release tag to install
    required: false
    default: v1.3.0
  timestamp-url:
    description: RFC 3161 TSA URL (overrides aas-sign's built-in default)
    required: false
    default: ""
  no-timestamp:
    description: Set to "true" to skip timestamping
    required: false
    default: "false"
  msi-dse:
    description: Set to "true" to add the enhanced MSI metadata signature
    required: false
    default: "false"
  recursive:
    description: Set to "true" to sign unsigned PE payloads before signing MSI installers; ignored for other targets
    required: false
    default: "false"
  max-parallel:
    description: Maximum concurrent signing operations
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install aas-sign and osslsigncode
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install-action.sh"

    - name: Sign
      shell: bash
      env:
        INPUT_ENDPOINT:      ${{ inputs.endpoint }}
        INPUT_ACCOUNT:       ${{ inputs.account }}
        INPUT_PROFILE:       ${{ inputs.profile }}
        INPUT_FILES:         ${{ inputs.files }}
        INPUT_CLIENT_ID:     ${{ inputs.client-id }}
        INPUT_TENANT_ID:     ${{ inputs.tenant-id }}
        INPUT_TOKEN:         ${{ inputs.token }}
        INPUT_TIMESTAMP_URL: ${{ inputs.timestamp-url }}
        INPUT_NO_TIMESTAMP:  ${{ inputs.no-timestamp }}
        INPUT_MSI_DSE:       ${{ inputs.msi-dse }}
        INPUT_RECURSIVE:     ${{ inputs.recursive }}
        INPUT_MAX_PARALLEL:  ${{ inputs.max-parallel }}
      run: |
        set -euo pipefail

        # Parse multi-line `files` input, trim whitespace, skip blanks.
        files=()
        while IFS= read -r line; do
          line="$(printf '%s' "${line}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [ -z "${line}" ] && continue
          files+=("${line}")
        done <<< "${INPUT_FILES}"

        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::aas-sign: no files provided"
          exit 1
        fi

        args=(
          --osslsigncode "${AAS_SIGN_OSSLSIGNCODE}"
          --endpoint "${INPUT_ENDPOINT}"
          --account  "${INPUT_ACCOUNT}"
          --profile  "${INPUT_PROFILE}"
        )

        # Auth: explicit token wins; otherwise use the OIDC flow which
        # aas-sign implements directly against GitHub's id-token endpoint.
        if [ -n "${INPUT_TOKEN}" ]; then
          echo "::add-mask::${INPUT_TOKEN}"
          args+=(--token "${INPUT_TOKEN}")
        elif [ -n "${INPUT_CLIENT_ID}" ] && [ -n "${INPUT_TENANT_ID}" ]; then
          args+=(
            --oidc-client-id "${INPUT_CLIENT_ID}"
            --oidc-tenant-id "${INPUT_TENANT_ID}"
          )
        else
          echo "::error::aas-sign: must provide either token, or both client-id and tenant-id"
          exit 1
        fi

        if [ -n "${INPUT_TIMESTAMP_URL}" ]; then
          args+=(--timestamp-url "${INPUT_TIMESTAMP_URL}")
        fi
        if [ "${INPUT_NO_TIMESTAMP}" = "true" ]; then
          args+=(--no-timestamp)
        fi
        if [ "${INPUT_MSI_DSE}" = "true" ]; then
          args+=(--msi-dse)
        fi
        if [ "${INPUT_RECURSIVE}" = "true" ]; then
          args+=(--recursive)
        fi
        if [ -n "${INPUT_MAX_PARALLEL}" ]; then
          args+=(--max-parallel "${INPUT_MAX_PARALLEL}")
        fi

        aas-sign sign "${args[@]}" "${files[@]}"
