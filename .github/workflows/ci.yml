name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native:
    name: Native build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DDEPS=FETCH
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  mingw:
    name: MinGW compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      - name: Configure
        run: >-
          cmake -S . -B build-mingw
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/x86_64-w64-mingw32.cmake
          -DCMAKE_EXE_LINKER_FLAGS=-static
          -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build-mingw -j2
