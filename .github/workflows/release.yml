name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      aas_linux: ${{ steps.assets.outputs.aas_linux }}
      aas_windows: ${{ steps.assets.outputs.aas_windows }}
      ossl_linux: ${{ steps.assets.outputs.ossl_linux }}
      ossl_windows: ${{ steps.assets.outputs.ossl_windows }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - id: assets
        run: python3 scripts/release-assets.py "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

  build-linux:
    runs-on: ubuntu-24.04
    needs: metadata
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison valac gettext patch pkg-config perl
          python3 -m pip install meson==1.9.1
      - name: Build companion and aas-sign
        env:
          AAS_ASSET: ${{ needs.metadata.outputs.aas_linux }}
          OSSL_ASSET: ${{ needs.metadata.outputs.ossl_linux }}
        run: |
          set -euo pipefail
          python3 scripts/build-osslsigncode.py
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAAS_SIGN_RELEASE_VERSION="$GITHUB_REF_NAME" \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DAAS_SIGN_OSSLSIGNCODE="$PWD/build-companion/osslsigncode"
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          strip build/aas-sign build-companion/osslsigncode
          python3 scripts/check-runtime-deps.py build/aas-sign build-companion/osslsigncode
          mkdir -p release
          cp build/aas-sign "release/${AAS_ASSET}"
          cp build-companion/osslsigncode "release/${OSSL_ASSET}"
          cmake -P cmake/BundleDeps.cmake
          python3 scripts/release-provenance.py --output release
      - name: Package source release
        env:
          AAS_SIGN_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cmake -P cmake/SourceRelease.cmake
          mv aas-sign-*.tar.gz release/
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: release/*

  build-aas-windows:
    runs-on: ubuntu-24.04
    needs: metadata
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      - name: Build
        env:
          AAS_ASSET: ${{ needs.metadata.outputs.aas_windows }}
        run: |
          set -euo pipefail
          cmake -B build-mingw -DCMAKE_BUILD_TYPE=Release -DAAS_SIGN_RELEASE_VERSION="$GITHUB_REF_NAME" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/x86_64-w64-mingw32.cmake \
            -DCMAKE_EXE_LINKER_FLAGS=-static -DBUILD_TESTING=ON
          cmake --build build-mingw -j2
          x86_64-w64-mingw32-strip build-mingw/aas-sign.exe
          python3 scripts/check-runtime-deps.py build-mingw/aas-sign.exe
          mkdir -p release
          cp build-mingw/aas-sign.exe "release/${AAS_ASSET}"
      - uses: actions/upload-artifact@v5
        with:
          name: aas-windows
          path: release/*
      - uses: actions/upload-artifact@v5
        with:
          name: windows-tests
          path: |
            build-mingw/platform_test.exe
            build-mingw/msi_recursive_test.exe
            build-mingw/signing_test_driver.exe

  build-ossl-windows:
    runs-on: windows-2022
    needs: metadata
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build static companion
        shell: pwsh
        env:
          OSSL_ASSET: ${{ needs.metadata.outputs.ossl_windows }}
        run: |
          python scripts/build-osslsigncode.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-runtime-deps.py build-companion/osslsigncode.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build-companion/osslsigncode.exe "release/$env:OSSL_ASSET"
      - uses: actions/upload-artifact@v5
        with:
          name: ossl-windows
          path: release/*
      - uses: actions/upload-artifact@v5
        with:
          name: windows-openssl-helper
          path: build-companion/dependencies/prefix/bin/openssl.exe

  test-windows:
    runs-on: windows-2022
    needs: [metadata, build-aas-windows, build-ossl-windows]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/download-artifact@v5
        with:
          name: windows-tests
          path: build-windows
      - uses: actions/download-artifact@v5
        with:
          name: ossl-windows
          path: release
      - uses: actions/download-artifact@v5
        with:
          name: aas-windows
          path: release
      - uses: actions/download-artifact@v5
        with:
          name: windows-openssl-helper
          path: build-openssl-helper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test platform and signing
        shell: pwsh
        env:
          AAS_ASSET: ${{ needs.metadata.outputs.aas_windows }}
          OSSL_ASSET: ${{ needs.metadata.outputs.ossl_windows }}
        run: |
          $env:PATH = "$pwd/build-openssl-helper;$env:PATH"
          & "./release/$env:AAS_ASSET" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./build-windows/msi_recursive_test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./build-windows/platform_test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/signing_integration_test.py build-windows/signing_test_driver.exe "release/$env:OSSL_ASSET" . build-windows/msi_recursive_test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  sign-and-release:
    runs-on: ubuntu-24.04
    needs: [metadata, build-linux, build-aas-windows, build-ossl-windows, test-windows]
    environment: release
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: linux
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: '*-windows'
          path: release
          merge-multiple: true
      - name: Sign both Windows executables using the new Linux pair
        working-directory: release
        env:
          AAS_LINUX: ${{ needs.metadata.outputs.aas_linux }}
          AAS_WINDOWS: ${{ needs.metadata.outputs.aas_windows }}
          OSSL_LINUX: ${{ needs.metadata.outputs.ossl_linux }}
          OSSL_WINDOWS: ${{ needs.metadata.outputs.ossl_windows }}
          ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.CERTIFICATE_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          chmod +x "${AAS_LINUX}" "${OSSL_LINUX}"
          "./${AAS_LINUX}" sign --osslsigncode "$PWD/${OSSL_LINUX}" \
            --endpoint "${ENDPOINT}" --account "${ACCOUNT}" --profile "${PROFILE}" \
            "${AAS_WINDOWS}" "${OSSL_WINDOWS}"
      - name: Compute final checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum aas-sign-* osslsigncode-* THIRD-PARTY-NOTICES.txt provenance.json > sha256sums.txt
          sha256sum --check sha256sums.txt
      - name: Publish release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=()
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --generate-notes "${flags[@]}" aas-sign-* osslsigncode-* \
            THIRD-PARTY-NOTICES.txt provenance.json sha256sums.txt
          # Publish this identical manifest manually to the immutable R2 path:
          # https://artifacts.emberswan.com/aas-sign/<tag>/sha256sums.txt
